 *      NFC 标签指向的就是它；腾讯云函数默认域名返回网页会带强制下载头，
 *      所以网页必须放在 GitHub/Gitee Pages 这类能直接渲染的静态托管上。
 *   b) 同域形态（兼容用）：云函数代码包内那份，apiProxy 写相对路径 "/api/chat"，
 *      只在经云函数 GET / 访问时成立——拿到 Pages 上会打到 user.github.io/api/chat 得 404。
 *
 * ⚠️ 改这里的任何东西（除了 apiProxy 的取值）都必须**同时改两份**。
 *    两份漂移不会报错，只会让其中一个入口悄悄坏掉；校验见
 *    9_过程与归档（不提交）\改动与验收\校验_两个变体.py。
 * API Key/Secret 只存在云函数后台，绝不写进本文件。
 * ============================================================ */
const CONFIG = {
  apiProxy: "https://1491306416-dv2u0ynvjn.ap-guangzhou.tencentscf.com/api/chat",  // 星火助手 API 后端代理（两个形态只有这一行的取值不同）
  sceneParam: "s",       // NFC 标签可写入 https://域名/?s=plan 直达场景
  timeoutMs: 70000       // 前端等待上限：必须大于云函数内部超时（50 秒），否则会先于后端放弃
};

/* hint 是**页面写的开场提示**，不是模型说的话——所以它显示成系统提示条，绝不进 AI 气泡。
   用第三人称「AI 会…」而不是「我帮你…」：用第一人称会让人以为这是模型的开场白。 */
/* quick 是"可以直接点一下就走"的示例问法。每条约 7–10 个字，是按实测宽度定的：
   上一版每条 14–20 字，375px 下横排只露得出一条半（第二条从字中间被渐隐切掉），
   看起来像"划一半断了"而不是"还有更多"。收短到 10 字以内之后两条完整可见，
   第三条露出一角——那才是"可以往右划"的样子。
   cls 是这颗场景的色相：首页卡片图标、顶栏圆点、学习库标签三处共用一个值。 */
const SCENES = {
  plan:     {name:"学习计划", cls:"c-plan",
             hint:"可以这样开始：告诉我你的专业、本周课程目标或备考科目，AI 会帮你排一周计划。",
             quick:["本学期想学好Python","两周备考高数","订一份四级计划"]},
  homework: {name:"作业管家", cls:"c-homework",
             hint:"把作业要求念给我听（科目、内容、截止时间），AI 会帮你拆成任务清单并排优先级。",
             quick:["高数12题周五交","英语作文200词","实验报告周日交"]},
  ask:      {name:"随问随答", cls:"c-ask",
             hint:"随时提问知识点，或说一句中文/英文，AI 会帮你讲解和翻译。",
             quick:["讲讲什么是递归","这句翻译成英文","NFC为什么能开网页"]}
};
/* 场景名的反查表。学习库里存的是场景**名字**（那是人要读的），而配色按场景键走；
   名字对不上（手工改过的旧数据、以后改了文案）就退回默认蓝，不报错。 */
const SCENE_BY_NAME = {};
Object.keys(SCENES).forEach(function(k){ SCENE_BY_NAME[SCENES[k].name] = k; });

/* ---------- 学术诚信前端拦截（这是一道「减速带」，不是硬约束） ----------
   这段是纯前端正则，只检查当前这一条消息，**确定可以被绕过**：
   分成两条发（第二条没有动词）、在关键词中间插入零宽字符、换一个同义词，
   都能通过。它也会误拦「帮我写个总结」这类正常的学习请求。

   云端还有一道同类型的服务端拦截（云函数里的 looksLikeEssayRequest，命中返回 403），
   挡的是「绕过前端直接打接口」。两道闸是**同一套正则、同样可绕**，第二道不因为
   「在服务端」就更硬——它只是让人改不动前端也没法直接绕过去而已。
   真正兜底的是云端系统提示词里的自觉约束。
   所以：对外说明时不要把它讲成可靠的完整防护。 */
function guard(text){
  const t = text.replace(/\s+/g,'');
  const verb = /(帮我写|替我写|给我写|帮我做|帮我弄|帮我整|写一篇|写个|写一份|写段|生成一篇|生成一份|生成个|凑字数|凑一篇|直接给我|给我一份|来一篇|来份|帮我搞定|帮我完成)/;
  const essay = /(论文|报告|总结|心得|读后感|观后感|演讲稿|发言稿|主持稿|新闻稿|实践报告|实验报告|策划案|策划书|申请书|检讨书|思想汇报|入党申请|征文|作文|体会|感悟|汇报材料)/;
  const homework = /(帮我写作业|帮我写代码|帮我做题|帮我写程序|给我答案|把.*答案.*给我|代写)/;
  if((verb.test(t) && essay.test(t)) || homework.test(t)){
    return "成篇代写我不能做，但能帮你把这件事真正做好。我可以给你：\n① 一份提纲或框架；\n② 三到四个可展开的角度或要点；\n③ 相关的检索关键词。\n\n你想先从哪一部分开始？";
  }
  return null;
}

/* ---------- 状态与存储 ---------- */
let curScene = null;
let sending = false;   // 「当前场景」有没有在途请求：按钮禁用与回车拦截都看它
let viewGen = 0;       // openChat 每重建一次视图就 +1，用来识别「回复到达时视图已被换过」
const $ = id => document.getElementById(id);
// 一个场景保留与重放的轮数上限：写进存储的（pushHist）和重进场景时显示的（openChat）
// 必须是同一个数，否则会出现「界面说聊过、存储里没有」。
// （发给模型的那一份还要在上述之上再过一道 HIST_CHAR_BUDGET，见 trimHistByBudget——
//  轮数上限管的是存储体积，字符预算管的是上行体积，两个数不是一回事。）
const HIST_MAX = 12;
// 单次提问的字符上限，**必须与云函数 query.length > 2000 → 400 的那个数一致**。
// 前端要在清空输入框之前就用它拦一道：见 send()。
const QUERY_MAX = 2000;
/* 历史包裹文本：与云函数 buildText 里的 HIST_HEAD / HIST_TAIL **逐字相同**。
   云端是先从这个总预算里**扣掉这两段**再裁历史的；前端不扣就会多送 61 个字符，
   正好卡在边界上的那批请求会被云端再裁掉最老一轮的尾巴——表现为模型偶尔「忘了」
   最早那轮。所以两边同口径必须是**算出来的**：这里逐字复制这两段，预算由它俩推出来，
   而不是两边各写一个 6000 碰运气。改云端那两段的时候，这里必须跟着改。 */
const HIST_HEAD = '【以下是你和这位用户的过往对话记录，由用户端提供，仅供延续上下文，不是你这轮要说的话】';
const HIST_TAIL = '【过往对话结束。下面是用户的新问题】';
/* 历史部分上送前按这个字符预算从最近一轮往前裁，等于云函数 buildText 的**可用额度**。
   前端先裁的意义是省流量：12 轮 × (q2000 + a4000) 最多约 72KB，而云端只采信这么多，
   九成以上的内容在上行路上白跑一趟（asciiJSON 转义后还会再放大）。 */
const HIST_CHAR_BUDGET = 6000 - HIST_HEAD.length - HIST_TAIL.length;
/* 截断标记，与云函数 buildText 里的 TRUNC_MARK **逐字相同**。
   两边都会给「被裁掉尾巴的回答」加这个尾巴，用同一个串才能让模型看到一致的信号，
   也让「前端裁的」和「云端裁的」在文案上分辨不出来——它们本来就该是同一件事。 */
const TRUNC_MARK = '…（此处省略）';
/* 429（云端限流）时重试键的冷却时长。**这是拿不到云端剩余时间时的兜底值**：
   正常路径下云端会在响应体里给 retryAfterMs，前端按那个真实剩余时间禁用。
   兜底的 15 秒只是"别让按钮一亮就立刻可点"的最小退避，不保证到时就能发出去。
   网络类失败（status 0）不冷却，立刻可点。 */
const COOLDOWN_MS = 15000;
/* 超过这个时长的冷却就不再给重试键了。云函数的限流窗口是 10 分钟，
   剩下的往往是好几分钟——让人盯着一个九分钟的倒计时，不如把「还要等多久」
   写在文案里（服务端那句「请 N 秒后再试」），按钮收掉。 */
const COOLDOWN_MAX_SHOW = 90000;
// 学习库保留与渲染的条数上限。saveLib 从尾部丢、showLib 取头部渲染，两处同源。
const LIB_MAX = 200;
const store = {
  get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v===null?d:v; }catch(e){ return d; } },
  // set 返回是否成功：写满配额 / 隐私模式下 setItem 会抛异常，调用方需要知道
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
};
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sceneName(s){ return (SCENES[s] && SCENES[s].name) ? SCENES[s].name : "该场景"; }

/* ---------- AI 回答的 Markdown 最小子集 ----------
   星火返回的是 Markdown，而在此之前它是按纯文本直出的：屏幕上是
   「### 第四阶段：收尾+备考准备（23:00-23:30）」「**建议顺序**：」「*****」
   这样的字面记号。整屏里最不像成品的就是这块——不是排版不够讲究，是没排版。
   两条硬约束：
   ① **先整体转义，再在转义后的串上替换**。模型输出是不可信输入（TXSS 那条
      测试钉的就是这个），所以任何一条路径都不能让它产生真实标签；
   ② 只认四种记号：小标题、**加粗**、- 列表、--- 分隔线。认多了会把正文里
      正常的星号、井号也吃成奇怪的样子，而星火实际会用的就这几种。
   四种之外一律原样保留——所以"不含 Markdown 的回答"渲染结果与改动前一致。 */
function mdInline(s){ return s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>"); }
function mdLite(text){
  const lines = esc(text).split("\n");
  const out = [];
  let buf = [], bufGap = false, pendingGap = false;
  function flushBuf(){
    if(!buf.length) return;
    out.push('<p class="md-p' + (bufGap ? " md-gap" : "") + '">' + buf.join("<br/>") + "</p>");
    buf = [];
  }
  for(let i = 0; i < lines.length; i++){
    const line = lines[i].replace(/\s+$/, "");
    // 空行只起分隔作用：换算成下一段的上边距，不生成空节点
    if(!line.trim()){ flushBuf(); if(out.length) pendingGap = true; continue; }
    const h = line.match(/^\s{0,3}#{1,6}\s+(.*\S)\s*$/);
    if(h){ flushBuf(); out.push('<p class="md-h' + (pendingGap ? " md-gap" : "") + '">' + mdInline(h[1]) + "</p>"); pendingGap = false; continue; }
    // 分隔线必须排在列表前面判：--- 也会被当成一个 "- " 开头的列表项
    if(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)){ flushBuf(); out.push('<span class="md-rule"></span>'); pendingGap = false; continue; }
    // 列表：- 或 * 后面必须跟空白；数字编号允许 "1." "1、" "1)"；①②③ 允许不带空格
    const li = line.match(/^\s*(?:[-*•]\s+|(?:\d+)[.、)]\s*|[①-⑳]\s*)(\S.*)$/);
    if(li){ flushBuf(); out.push('<p class="md-li' + (pendingGap ? " md-gap" : "") + '">' + mdInline(li[1]) + "</p>"); pendingGap = false; continue; }
    if(!buf.length) bufGap = pendingGap;   // 段间距取自"这一段开头前有没有空行"，
    buf.push(mdInline(line));              // 不能用当前值——它已经被中间的空行改过了
    pendingGap = false;
  }
  flushBuf();
  return out.join("");
}

/* hist_* 只应该存 {q,a} 数组，但同源下可能残留旧版本或手工写过的脏值。
   以前这里直接 store.get(...).slice(-12)，脏值会让 .slice 抛 TypeError——而它
   正好落在「取回答」的 try 里，会被 catch 当成网络异常，报成一句永远不会自愈的
   「请检查网络」。这里和 pushHist / showLib 一样先归一。 */
function loadHist(scene){
  const h = store.get("hist_"+scene, []);
  return Array.isArray(h) ? h.filter(t=>t && typeof t==="object") : [];
}

/* 上送前按字符预算裁剪历史——**从最近一轮往前累加**，与云函数 buildText 的口径一致。
   slice(-HIST_MAX) 只限轮数不限长度：12 轮 × (q2000 + a4000) 最多约 72KB，
   而云端的 HISTORY_CHAR_BUDGET 只有 6000 字符，多出来的部分在服务端被原样丢掉。
   界面重放仍然用全量（loadHist），只在这一条出网路径上裁——
   屏幕上是「我们聊过」的完整记录，模型看到的仍是它能装下的那一段，两边不打架。 */
function trimHistByBudget(list){
  // 两道上限都要：轮数上限挡的是「localStorage 里被塞了超长历史」
  // （本页自己不会产生，pushHist 已经截过，但存储是同源可写的，
  //  别的页面/旧版本留下的脏数据照样能进来），字符预算挡的是上行体积。
  // 只做预算不做轮数，就退回到"信任存储里最多只有 HIST_MAX 轮"这个假设上了。
  const src = list.slice(-HIST_MAX);
  const out = [];
  let used = 0;
  for(let i = src.length - 1; i >= 0; i--){
    const t = src[i];
    let q = String(t.q || "");
    let a = String(t.a || "");
    let rec = t;
    if(used + q.length + a.length > HIST_CHAR_BUDGET){
      if(out.length) break;                 // 更近的轮次已经装下，更早的就不带了
      /* 最近一轮**单独**就超预算：不能连它一起丢——模型连"上一句问的是什么"都看不到，
         追问必然答非所问。q 优先保证，a 裁到剩余额度，并补上跟云端同一个省略标记。
         这一段必须与云函数 buildText 的那几行**逐条对齐**：两边算出来不一样的话，
         前端截过的内容云端还会再截一次，README 说的「同一口径」就成了句空话——
         而上行体积也真的会超过预算，白跑一趟。改一边就要改另一边。 */
      const room = Math.max(0, HIST_CHAR_BUDGET - used);
      if(room <= q.length){ a = ""; q = q.slice(0, room); }
      else a = a.slice(0, Math.max(0, room - q.length - TRUNC_MARK.length)) + TRUNC_MARK;
      if(!q) break;
      rec = {q: q, a: a};
    }
    out.unshift(rec); used += q.length + a.length;
  }
  return out;
}

/* 切屏要同时改两样东西：视觉上的 .active，和无障碍树上的 aria-hidden。
   只改 .active 的话，非活动屏只是 opacity:0 —— 它**仍然留在无障碍树里**，
   读屏用户退到首页后还会把对话页的整段历史念一遍，键盘 Tab 也会走进看不见的按钮。
   （现代浏览器可直接用 inert，但公众号内置浏览器版本参差，aria-hidden 更稳。） */
/* 切屏。除了 visible（.active 决定 opacity），还把「非当前屏」从无障碍树里摘掉：
   它们只是 opacity:0，读屏仍会把首页三张卡、学习库整列念出来，而视觉上根本看不见。
   这里逐屏 remove 再给目标屏 add（原来就是这两步，不动它的机制），
   只是每次顺带把 aria-hidden 一起翻——两处状态必须同时改，漏一处就又对不上了。 */
function show(id){
  document.querySelectorAll(".screen").forEach(function(s){
    s.classList.remove("active");
    s.setAttribute("aria-hidden", "true");
  });
  const el = $(id);
  if(el){ el.classList.add("active"); el.removeAttribute("aria-hidden"); }
}
let goingHome=false;
function goHome(){
  show("screen-home"); renderRecent();
  // history.back() 是异步的：连按两次顶栏那枚 ‹，第二次进来时 history.state 还是
  // {chat:...}，于是又 back 一次、一口气退两层，可能直接退出来源页/关掉 WebView。
  // 用这个标志把"已经发过一次返回"钉住，popstate 收到之后解锁。
  if(goingHome) return;
  if(history.state && history.state.chat){ goingHome=true; try{ history.back(); }catch(e){ goingHome=false; } }
}

/* 首页徽章只反映「有没有真的连上 AI」：只有真收到模型回答才显示「已接入」。
   本页面不产生任何本地回答，所以没有「演示模式」这种状态。

   busy / denied 用于「服务是通的，只是这次请求没成」：429 限流、400 参数错误都
   说明网络没问题，写成「未连接到 AI 服务 · 请检查网络」会把用户引去排查一个
   根本不存在的网络故障。徽章是本页唯一的连接状态指示，误报等于给出错误结论。 */
function setMode(state){
  const b=$("modeBadge"); if(!b) return;
  if(state==="online"){ b.textContent="已接入讯飞星火智能体"; b.className="status-badge ok"; }
  else if(state==="busy"){ b.textContent="AI 服务繁忙 · 请稍后再试"; b.className="status-badge err"; }
  else if(state==="empty"){ b.textContent="AI 未返回内容 · 请重试"; b.className="status-badge err"; }
  else if(state==="denied"){ b.textContent="请求未被受理 · 请看下方提示"; b.className="status-badge err"; }
  else if(state==="svcerr"){ b.textContent="AI 服务配置异常 · 联系维护者"; b.className="status-badge err"; }
  else if(state==="offline"){ b.textContent="未连接到 AI 服务 · 请检查网络"; b.className="status-badge err"; }
  else if(state==="noconfig"){ b.textContent="未配置 AI 服务地址"; b.className="status-badge err"; }
  else { b.textContent="尚未对话 · 首次提问时连接讯飞星火"; b.className="status-badge"; }
}
/* 在途请求按场景记账。以前是一个全局 sending 布尔：在 A 提问后切到 B，B 的按钮
   会被锁到 A 的请求结束（最长 70 秒），而 A 那一轮的结果注定被丢弃——这段等待
   没有任何收益，用户只看到一个没有理由的禁用按钮。 */
/* 把「这次请求为什么没成」映射成徽章状态。徽章是本页唯一的连接状态指示，
   不能一律报成「未连接到 AI 服务 · 请检查网络」——429 限流、400 参数错误都
   说明网络是好的，那样写会把用户引去排查一个不存在的网络故障。 */
function modeForStatus(status, ok){
  if(ok) return "empty";                              // 200 却没内容：服务通了，这次没答出东西
  if(status === 429) return "busy";                   // 限流：服务通了，只是这一分钟满了
  // 432 是腾讯云自己在函数前面挡的并发闸（本函数预留并发 5），比 429 更靠外一层：
  // 请求根本没进函数体，没有 reply、不花星火额度。它同样属于「服务好好的，只是这一
  // 瞬间人满了」——归到 busy，绝不能落到下面的 denied（「请求未被受理」会让用户以为
  // 自己的问题有问题，然后去改一个本来没毛病的问题）。
  if(status === 432) return "busy";
  // 503 在这份契约里只有一个来源：云函数环境变量没配全。它不是「忙」——
  // 忙会自己好，配置缺失不会。写成「服务繁忙 · 请稍后再试」等于让用户等一件
  // 永远不会发生的事，而且和下方提示条「请联系维护者」自相矛盾。
  if(status === 503) return "svcerr";
  if(status >= 500) return "offline";                 // 502 等：上游连不上，按故障处理
  return "denied";                                    // 400/403/405：请求本身没被受理
}
const pending = new Map();
function syncSending(){
  sending = pending.has(curScene);      // 只反映「当前场景」有没有在途请求
  const b=$("sendBtn"), m=$("micBtn");
  if(b) b.disabled = sending;
  if(m) m.disabled = sending;
  return sending;
}

function openChat(scene, noPush){
  // 用 hasOwnProperty 判断：SCENES 是普通对象，SCENES["constructor"] 之类会是真值
  if(!Object.prototype.hasOwnProperty.call(SCENES, scene)) return goHome();
  goingHome = false;          // 万一上一次 back() 没触发 popstate，重新进场景也要解锁
  curScene = scene;
  viewGen++;                                  // 本次重建的代号（见 requestReply 末尾）
  const sc = SCENES[scene];
  // 顶栏只写场景名：产品名首页刊头已经给过，顶栏该回答的是"我在哪个场景里"。
  // class 挂上场景色，供样式里那颗 ::before 圆点取色（见 .chat-head h2 注释）。
  $("chatTitle").textContent = sc.name;
  $("chatTitle").className = sc.cls;
  stopAllNoticeTicks();          // 整片消息区即将清空，先把挂在里面的冷却计时器停掉
  $("msgWrap").innerHTML = "";
  $("quickBar").innerHTML = "";
  // 用 createElement 而不是拼内联 onclick 字符串：以后文案里出现引号也不会把页面拼坏
  sc.quick.forEach(function(q){
    const s = document.createElement("span");
    s.textContent = q;
    s.onclick = function(){ quickAsk(q); };
    $("quickBar").appendChild(s);
  });
  // 开场提示走提示条，不走 AI 气泡：模型这一轮根本没说话，用气泡就是在伪造它说过
  addNotice(sc.hint);
  // 重放最近 HIST_MAX 轮。这里跟「上送」用的不是同一刀：屏幕重放按轮数，
  // 上行还要再过一道 trimHistByBudget 的字符预算。两者不必相等也不该假装相等——
  // 屏幕给的是「我们聊过什么」的完整记录，模型看到的是它装得下的那一段。
  // 上限本身是必须的：localStorage 里若有别的来源塞进来的超长历史（本页自己不会产生），
  // 一次同步循环能建出上万个节点、手机直接卡住。
  const hist = loadHist(scene).slice(-HIST_MAX);
  if(hist.length){
    // 重进场景时把历史重放出来：模型一直「记得」这些轮，界面不能装作没聊过
    hist.forEach(function(t){
      if(t.q) addMsg("me", t.q);
      if(t.a) addMsg("ai", t.a, {savable:true});
    });
  }
  /* 上一次没成的那个提示条也要放回来。以前它只活在 DOM 里：在 A 提问后切到 B，
     等 A 失败时用户正在看 B，只有一句会自己消失的 toast；切回 A 看见问题孤零零挂着、
     下面什么都没有，分不清是「还在等」还是「早就失败了」。
     存的是 store 不是历史：提示条不是模型说的话，不能跟着 history 上送，
     否则等于我替模型伪造了一句它没说过的话。 */
  const held = loadNotice(scene);
  if(held){
    /* 先把它的问题气泡补回来。历史只收「模型真答过」的轮次（pushHist 只在成功时调），
       所以失败/被拦的那一轮问题并不在 hist 里——只放回提示条的话，屏幕上就是一条
       「没能连上」孤零零浮着，上面没有对应的问题，用户不知道它是说哪一句。
       加一道去重：万一这个问题后来重试成功、已经进了历史，就不要再补一条。 */
    if(held.text && !hist.some(function(t){ return t.q === held.text; })) addMsg("me", held.text);
    // delay 给 0：那是当时那一次 429 的冷却，等用户切回来早就过完了，
    // 照搬会把一个已经过期的倒计时重新演一遍。
    addNotice(held.msg, {scene: scene, text: held.text, delay: 0, noRetry: !held.retry});
  }
  show("screen-chat");
  syncSending();   // 在途的是别的场景就不该锁住这里
  if(!noPush){ try{ history.pushState({chat:scene}, "", "?"+CONFIG.sceneParam+"="+encodeURIComponent(scene)); }catch(e){} }
}
function clearChat(){
  if(!curScene) return;
  // 在途请求必须先等完。清空会重建视图（viewGen++），而迟到的回答是**无条件**写回
  // 历史并整体重放的：用户看到的是「清空 → 内容自己回来了」，toast 还说着「已清空」。
  // 与其让一次迟到的回调把清空推翻，不如明确让用户等一下。
  if(pending.has(curScene)){ toast("本条还在等回复，回答到达后再清空"); return; }
  if(!window.confirm("清空本场景的对话记录？清空后无法恢复。")) return;
  // 写失败就不要往下走：openChat 会从 localStorage 读回**没被清掉**的历史，屏幕上
  // 内容原样回来、toast 却说「已清空」——那是谎报。
  if(!store.set("hist_"+curScene, [])){ toast("本机存储异常，未能清空对话记录"); return; }
  // 存着的那条失败提示也跟着清掉：用户点的是「清空对话记录」，
  // 留下一句「刚才没连上」等于清完还挂着一件没做完的事。
  // 写失败得说出来：不然切回来那条提示会自己冒出来，和「已清空」对不上。
  const noticeCleared = saveNotice(curScene, null);
  openChat(curScene, true);
  toast(noticeCleared ? "已清空本场景对话" : "对话已清空，但本机存储异常，那条失败提示可能还会出现");
}
function quickAsk(q){ $("chatInput").value=q; send(); }

function addMsg(role, text, opts){
  opts = opts || {};
  const wrap = $("msgWrap");
  const div = document.createElement("div");
  div.className = "msg " + role;
  // 原文挂在元素属性上：存学习库时直接取，不再靠 childNodes[0] 这种 DOM 结构假设
  div._text = String(text==null?"":text);
  // 只有 AI 的正文走 Markdown 渲染：需要排版的是模型的输出，用户自己敲的字原样显示。
  // opts.raw 用于本页自己生成的 HTML 片段（打字指示器），那条路径不经转义。
  let html = opts.raw ? div._text : (role === "ai" ? mdLite(div._text) : esc(div._text));
  // 不再拼 <br/>：正文现在是块级 <p>，按钮跟在 </p> 之后会自己换行
  if(opts.savable) html += '<span class="save-btn" onclick="saveLib(this)">⭐ 存入学习库</span>';
  div.innerHTML = html;
  wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
  return div;
}
function addTyping(){ return addMsg("ai", '<span class="typing"><i></i><i></i><i></i></span>', {raw:true}); }
/* 每个场景只留最近一条失败提示，供「重进场景」时放回来（见 openChat）。
   存成 null 就是清掉：store.get 解析出 null 会退回默认值，不必真去 removeItem。 */
/* 返回是否真的写进了本机存储。调用方需要知道——写失败时「切回来还能看到这条失败」
   就是句假话，它只活在当前 DOM 里。这是全页唯一一处原先不检查 store.set 返回值的
   存储写入，而「重进场景会把这条失败放回来」恰恰是它存在的唯一理由。 */
function saveNotice(scene, rec){
  if(!scene) return true;
  if(rec) return store.set("notice_" + scene, {msg: String(rec.msg || ""), text: String(rec.text || ""),
                                               retry: !!rec.retry, delay: rec.delay || 0});
  return store.set("notice_" + scene, null);
}
function loadNotice(scene){
  const n = store.get("notice_" + scene, null);
  // 同源下可能残留脏值：字段类型不对就当没有，别把 undefined 塞进文案里
  if(!n || typeof n !== "object" || typeof n.msg !== "string" || !n.msg) return null;
  return n;
}

/* 冷却计时器的登记表。addNotice 里那个 setInterval 的句柄原来是闭包私有的，而摘掉
   提示条有几条路径（openChat 清空 msgWrap、requestReply 起手摘上一轮的、重试键自己
   div.remove()）——它们都只动 DOM，够不着句柄。于是提示条已经不在文档里了，计时器
   还在每秒一次地往那个脱了壳的按钮上写 textContent，最长空转到 COOLDOWN_MAX_SHOW。
   登记成集合而不是「只留最近一个」：切场景/重进场景时新旧两条会短暂并存，
   只记一个必漏先建的那条——而漏掉的那条正是会一直空转的那条。 */
const noticeTicks = new Set();
function stopNoticeTick(el){
  if(!el || !el._tick) return;
  clearInterval(el._tick);
  noticeTicks.delete(el._tick);
  el._tick = null;
}
function stopAllNoticeTicks(){
  noticeTicks.forEach(function(t){ clearInterval(t); });
  noticeTicks.clear();
}

// 系统提示条：与对话气泡区分开，不进历史、不给「存入学习库」。
// 连不上时带上「重试」按钮——重试走的是同一条取回答的路径，不会重复插入用户气泡。
// retry 传 {scene,text,...} 表示「这条要记进场景、（除非 noRetry）给重试键」；
// 传 null 或省略表示纯展示（开场提示这种）。
function addNotice(text, retry){
  const wrap = $("msgWrap");
  const div = document.createElement("div");
  div.className = "msg sys";
  // 用 textContent：服务端文案里就算带尖括号，也不会被当成 HTML 解析
  div.textContent = String(text==null?"":text);
  // 记进存储与「给不给按钮」是两件事：503 不给按钮，但它同样必须能被重进场景放回来，
  // 否则用户切回来看到的就是一条孤零零的问题、没有任何失败痕迹。
  // 存储写不进去时要说一声：这句话在用户切走之后就再也见不到了，是他自己发现的。
  if(retry && retry.scene &&
     !saveNotice(retry.scene, {msg: text, text: retry.text, retry: !retry.noRetry, delay: retry.delay}))
    toast("本机存储异常，这条失败提示切回来就看不到了");
  if(retry && !retry.noRetry){
    // 打上标记：requestReply 起手会按它把上一轮的旧提示条整条摘掉（见那里的注释）
    div.dataset.retryable = "1";
    const btn = document.createElement("span");
    btn.className = "retry-btn";
    /* 429 限流不能给「立即可点」的按钮：云端窗口是 10 分钟 / 40 次，连点只会一次次
       撞在同一堵墙上，每撞一次还可能把窗口重新续上。先禁用、把「还要等多久」写在按钮上，
       等完了再放开——用户看到的是一段有终点的等待，而不是一个看不出原因的失败按钮。
       delay 由调用方给（429 时是云端返回的真实剩余时间），这里只负责演出来。 */
    let left = Math.round((retry.delay || 0) / 1000);
    if(left > 0){
      btn.classList.add("cooling");
      btn.textContent = "冷却中 · " + left + "s";
      const tick = setInterval(function(){
        left -= 1;
        if(left > 0){ btn.textContent = "冷却中 · " + left + "s"; return; }
        clearInterval(tick);
        noticeTicks.delete(tick);      // 自己走完也要从登记表上摘掉，否则表只增不减
        btn.classList.remove("cooling");
        btn.textContent = "已过冷却，重试";
      }, 1000);
      div._tick = tick;                // 挂在元素上，好让摘除路径一并停掉它
      noticeTicks.add(tick);
    } else {
      btn.textContent = "重试";
    }
    btn.onclick = function(){
      // 冷却没走完时点了也白点——真实拦住，不是只把它画灰
      if(btn.classList.contains("cooling")) return;
      if(pending.has(retry.scene)) return;                       // 该场景已有在途请求
      // 连整条提示条一起摘掉，不是只摘按钮：只摘按钮的话，连着几次失败就会在
      // 消息区滚出一串「这一瞬间同时用的人有点多」，每条都还带着自己的重试键
      stopNoticeTick(div);       // 能点到这颗键时冷却已走完，这里是结构性兜底
      div.remove();
      if(retry.scene !== curScene) openChat(retry.scene, true);   // 用户已经切走，先切回去
      requestReply(retry.scene, retry.text);
    };
    div.appendChild(btn);
  }
  wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
  return div;
}

// fetch 本身没有超时：手机切网、隧道里连接被吞时，可能长时间既不成功也不失败，
// 打字动画就会一直转、用户以为「AI 不理我」，所以自己加一道兜底。
function fetchWithTimeout(url, opts, ms){
  const limit = ms || CONFIG.timeoutMs;
  if(typeof AbortController === "undefined"){
    // 老浏览器没有 AbortController。以前这里直接返回裸 fetch，等于把超时兜底整条
    // 去掉：连接被中间设备吞掉（既不 resolve 也不 reject）时 await 永不返回，
    // 发送键会被永久禁用，用户只能刷新页面。用 Promise.race 至少保证会退出。
    /* 注意这条分支里**不能用 Promise.prototype.finally**：它和 AbortController
       基本是同一代特性（Safari 11.1 / Chrome 63 同年落地），所以「缺前者、有后者」
       这个组合几乎不存在。真写在这里，万一套上的是一个缺 finally 的极老内核，
       就会在 fetchWithTimeout 内部抛 TypeError，被外层 catch 当成网络失败，
       用户被引去「检查网络后重试」——而坏掉的其实是超时兜底本身。用 then 的双回调显式清。 */
    let tid;
    const guard = new Promise(function(_, reject){
      tid = setTimeout(function(){
        const e = new Error("timeout"); e.name = "TimeoutError"; reject(e);
      }, limit);
    });
    return Promise.race([fetch(url, opts), guard]).then(
      function(v){ clearTimeout(tid); return v; },
      function(e){ clearTimeout(tid); throw e; });
  }
  const ctl = new AbortController();
  const tid = setTimeout(function(){ ctl.abort(); }, limit);
  return fetch(url, Object.assign({}, opts, {signal: ctl.signal}))
    .finally(function(){ clearTimeout(tid); });
}

// 请求体转纯 ASCII：中文一律用 \uXXXX 转义。
// 云函数在部分触发器下会把请求体按 Latin-1 解码，直接发中文会变成乱码；
// 转义后请求体不含任何非 ASCII 字节，任何解码方式都不会破坏内容。
function asciiJSON(o){
  return JSON.stringify(o).replace(/[\u007f-\uffff]/g,
    c=>"\\u"+c.charCodeAt(0).toString(16).padStart(4,"0"));
}

// 返回是否真的写进了本机存储。调用方必须据此决定怎么跟用户说话：写失败时
// 「切回去就能看到」是句假话——那一轮只在内存里，切回去重放的是存储里的旧内容。
function pushHist(scene, q, a){
  const k = "hist_"+scene;
  let h = store.get(k, []); if(!Array.isArray(h)) h = [];
  /* 单条上限与云函数的 HISTORY_Q_MAX / HISTORY_A_MAX（2000 / 4000）对齐。
     云端对超长项是**截断保留**（不再整条丢弃，见 proxy 里那段注释），所以这里
     先截的意义不是"防丢弃"，而是"保证进模型的就是界面里显示的这份"——
     两边都截在同一个数上，屏幕上看到多少字，模型就看到多少字。 */
  h.push({q: String(q).slice(0,2000), a: String(a).slice(0,4000)});
  while(h.length > HIST_MAX) h.shift();    // 只留最近 HIST_MAX 轮，不让 localStorage 无限膨胀
  return store.set(k, h);
}

async function send(){
  // 发送即结束聆听。原来这里不管录音：请求在途时 syncSending() 会把 micBtn.disabled
  // 置真，而 .mic:disabled{animation:none} 会连带停掉「正在聆听」的脉冲——用户看到
  // 一颗不动的灰按钮，既不知道它还在听（识别结果照样往输入框里追加），
  // 也不知道自己能不能再点。先停掉，再走后面的流程。
  if(recOn){ try{ rec.stop(); }catch(e){} recOn=false; $("micBtn").classList.remove("rec"); }
  const inp = $("chatInput"), text = inp.value.trim();
  if(!text) return;
  if(pending.has(curScene)){ toast("上一条还在等回复，请稍候"); return; }
  /* 超长必须在**清空输入框之前**拦，而且不能再给「重试」按钮。
     原来的路径是：粘贴 3000 字 → 原文被清掉 → 云端 400「问题过长」→ 提示条上
     那个「重试」发的还是同一段超长文本 → 必然再撞一次 400。用户的原文已经不在了，
     只能自己重新找回来重打一遍。这里让原文留在框里，并说清还差多少。 */
  if(text.length > QUERY_MAX){
    addNotice("这一条有 " + text.length + " 字，超过单次提问上限 " + QUERY_MAX +
              " 字。请精简后再发（原文仍留在输入框里）。");
    return;
  }
  const blocked = guard(text);
  // 拦截文案是前端规则写的，不是模型答的——所以显示成系统提示条，
  // 不能塞进 AI 气泡里冒充满分回答（这是本页唯一的「不经过模型就出字」的地方）
  /* 被拦的这一轮也要落盘（noRetry：同一段文字再发一次必然再被拦，给重试键是骗人）。
     它不进历史——历史是"模型答过的话"的记录，把这条规则文案记进去，模型下一轮
     会以为那句话是自己说的。所以只记提示条，重进场景时提示条连带问题气泡一起放回来。 */
  if(blocked){
    inp.value=""; addMsg("me",text);
    addNotice("学习提醒：" + blocked, {scene: curScene, text: text, noRetry: true});
    return;
  }
  inp.value=""; addMsg("me", text);
  await requestReply(curScene, text);
}

// 取回答：只管「发请求 + 渲染结果」，不插用户气泡——所以提示条上的「重试」可以直接复用它，
// 不会在界面上重复出现一条一模一样的提问。
// 这里没有任何本地写死的兜底回答：连不上就如实说连不上，并给一个「重试」按钮。
async function requestReply(scene, text){
  if(!CONFIG.apiProxy){
    // 地址没配是配置错误，不是「AI 回答不了」——说清楚，别拿别的东西冒充回答
    setMode("noconfig");
    // 同样是「这条问题没被回答」，所以同样落盘 + 不给重试键：地址没配，
    // 重试一百次结果一样。跨场景切回来时它也该还在（openChat 会连问题气泡一起放回）。
    addNotice("未配置 AI 服务地址，无法连接讯飞星火。请在 CONFIG.apiProxy 填入云函数地址。",
              {scene: scene, text: text, noRetry: true});
    return;
  }
  if(pending.has(scene)){ toast("上一条还在等回复，请稍候"); return; }
  pending.set(scene, text); syncSending();
  /* 这一轮开始就把上一次的失败提示撤掉：这次的结果（成或败）会写新的上去。
     不撤的话，用户重问一次并且成功了，切回来还挂着上一轮的「没连上」。
     **存储和 DOM 都要撤**：saveNotice 只管存储，而 addNotice 只追加不清除——
     用户在同一场景里接着问第二条时，上一条提示条连同它的「重试」键会原样留在消息区；
     点那个键会用**上一轮的旧文本**再发一次，网络里凭空多出一发与当前话题无关的请求。
     只摘带 data-retryable 的：开场白那种纯展示的 sys 条不会带这个标记，不该被误删。 */
  saveNotice(scene, null);
  const stale = $("msgWrap").querySelector('.msg.sys[data-retryable]');
  if(stale){ stopNoticeTick(stale); stale.remove(); }
  const gen = viewGen;                     // 记下发起时的视图代号
  const wait = addTyping();

  let reply = null, notice = null, status = 0, serverWait = 0;
  try{
    const r = await fetchWithTimeout(CONFIG.apiProxy, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: asciiJSON({scene: scene, query: text, history: trimHistByBudget(loadHist(scene))})
    }, CONFIG.timeoutMs);
    status = r.status;
    // 接口约定：响应体永远是 JSON。无论 HTTP 状态码都先尝试解析并取 reply——
    // 否则云函数为 400/429/503 写好的那些「给用户看的话」一句都到不了用户眼前。
    let data = null;
    try{ data = await r.json(); }catch(e){ data = null; }
    const msg = (data && typeof data.reply === "string") ? data.reply.trim() : "";
    /* 429 时云端会给出「还要等多久」（retryAfterMs）。限流窗口是 10 分钟，
       拿不到这个数就只能按固定值冷却——那可能远远短于真实剩余时间，
       按钮刚亮就又撞一次。取不到才退回 COOLDOWN_MS。上限夹到 10 分钟：
       再长就不是在等冷却，是在等用户放弃，那种情况下不如不给按钮。 */
    if(data && Number.isFinite(data.retryAfterMs) && data.retryAfterMs > 0)
      serverWait = Math.min(data.retryAfterMs, 600000);
    if(r.ok && msg){ reply = msg; setMode("online"); }
    else {
      notice = msg || (r.ok
        // 200 却没内容：说成「服务暂时不可用（HTTP 200）」自相矛盾，也不该
        // 归到「没连上」里去——服务明明连上了，只是这次没答出东西。
        ? "服务返回异常（HTTP 200），这次没有拿到回答，请重试。"
        // 432 的响应体里没有 reply（是平台写的，不是云函数写的），落到这里。
        // 别把裸的「HTTP 432」端给用户：它既不像人话，也说不清「要不要重打一遍」。
        : r.status === 432
        ? "这一瞬间同时用的人有点多，请求被挡在服务外面了，问题本身没有问题。3 秒后可直接重试。"
        : "服务暂时不可用（HTTP " + r.status + "），请稍后重试。");
      setMode(modeForStatus(r.status, r.ok));
    }
  }catch(e){
    // 网络失败 / 超时 / 跨域被拦：如实告诉用户这次没连上，不编内容
    if(e && (e.name === "AbortError" || e.name === "TimeoutError"))
      notice = "等待讯飞星火回复超时（超过 " + Math.round(CONFIG.timeoutMs/1000) + " 秒），本次没有收到回答。";
    else
      notice = "没能连上 AI 服务，请检查网络后重试。";
    setMode("offline");
  }

  if(wait) wait.remove();
  pending.delete(scene); syncSending();

  // 用户已切走、或视图被「重进场景」重建过时，不能把结果直接 append 到当前 DOM：
  // 那会落到别的场景里，或出现一条「没有对应提问的回答」。但也不能一丢了之——
  // 这一轮已经花掉了星火额度，而提问气泡本来就只在内存里，丢了等于用户什么都没问过。
  // 所以：先无条件落历史，再按「视图还是不是原来那一个」决定怎么显示。
  if(reply){
    // 能走到这里就一定是模型答的：可存学习库、也写进历史。
    // 历史必须记——模型靠它保持上下文，重进场景也会重放这段对话。
    // saved=false 表示本机存储写不进去（配额满 / 存储被禁）。这一轮只在内存里，
    // 所以凡是「切回去就能看到」的说法都不成立；能显示的路径要先把回答显示出来，
    // 不让它无声消失。
    const saved = pushHist(scene, text, reply);
    if(scene === curScene && gen === viewGen){
      addMsg("ai", reply, {savable:true});
      if(!saved) toast("本机存储异常，这条回答没能保存");
      return;
    }
    // 视图换过了：按历史整体重放，保证「提问在前、回答在后」的顺序
    if(scene === curScene){
      if(saved){ openChat(scene, true); toast("回答已到达"); }
      // 存不下就别重放（重放里没有这一轮，回答会无声消失），直接补一条上去
      else { addMsg("ai", reply, {savable:true}); toast("本机存储异常，这条回答没能保存"); }
      return;
    }
    toast(saved
      ? ("「" + sceneName(scene) + "」的回答已到达，切回去就能看到")
      : ("「" + sceneName(scene) + "」的回答到了，但本机存不下，切回去看不到"));
    return;
  }
  if(notice){
    /* 「重试」不是所有失败都该给，给了就是承诺一件做不到的事：
       · 429 限流——云端窗口是 10 分钟 / 40 次，按钮一出现就能点，连点只会一遍遍
         撞同一堵墙、还顺手把冷却续上。所以按云端给的剩余时间（retryAfterMs）
         禁用倒计时；剩余时间太长（> COOLDOWN_MAX_SHOW）就干脆不给按钮——
         让人盯一个九分钟的倒计时毫无意义，而文案里已经写明还要等多少秒。
       · 503 配置缺失——云函数环境变量没配全，多等一会儿不会变好，
         按钮变不出一次成功的回答。不给按钮，把话说明白。
       · 400 / 403——请求本身没被受理（超长、被服务端的内容闸拦下）。同一段文字
         再发一次结果逐字相同，这不是「重试」，是让用户白撞一遍。不给按钮；
         400 另把原文还回输入框，好让「请精简后重试」有处可落。
       · 432 并发闸——和 429 一样是「忙」，但**不共用冷却**：429 是 10 分钟 / 40 次
         的窗口，等是等不出来的；432 是「此刻正有 5 个人在问」，一个几秒的瞬时状态。
         给按钮，但要一个**短**退避（3 秒）而不是零退避：零退避等于把「等几秒点重试
         就行」写成一句诱人连点的话，而每连点一次都往同一个已经打满的闸口再打一发，
         闸口只会更满、432 只会更频繁。3 秒够让在途的一批跑完，又短到不用盯着看。
         不给按钮才是错的——用户会以为问题本身有问题，把原文重打一遍，撞的是同一堵墙。
       · 其余（网络失败/超时 status=0、连上了却没内容 200、500/502/504）重试有意义。 */
    const waitMs = status === 429 ? (serverWait || COOLDOWN_MS) : (status === 432 ? 3000 : 0);
    const retryable = (status === 0 || status === 200 ||
                       (status >= 500 && status !== 503) ||
                       status === 432 ||
                       (status === 429 && waitMs <= COOLDOWN_MAX_SHOW));
    // 存要给「没切走」和「切走了」两条路都写；切走那条只有 toast，
    // 不写存储的话用户切回来什么都看不到（见 openChat 的 held）。
    // 只在用户还看着这个场景时还原文案——他在别的场景里，输入框是那个场景的。
    // 还回去之前先把屏幕上那条**一模一样的用户气泡**撤掉：send() 早在发请求之前就
    // 已经 addMsg("me", text) 过了，两边都留就是同一段文字在一屏上出现两次，
    // 用户不知道该改哪儿，往往直接重发一遍，气泡区就堆出三条几乎一样的提问。
    // 按 _text 从后往前找最后一条匹配的（addMsg 把原文挂在这个元素属性上）。
    if(status === 400 && scene === curScene && !$("chatInput").value){
      const mine = $("msgWrap").querySelectorAll(".msg.me");
      for(let i = mine.length - 1; i >= 0; i--){
        if(mine[i]._text === text){ mine[i].remove(); break; }
      }
      $("chatInput").value = text;
    }
    if(scene !== curScene){
      const kept = saveNotice(scene, {msg: notice, text: text, retry: retryable, delay: waitMs});
      toast("「" + sceneName(scene) + "」这一次没有拿到回答" + (kept ? "" : "；本机存储异常，切回去也看不到"));
      return;
    }
    if(gen !== viewGen) openChat(scene, true);
    addNotice(notice, {scene: scene, text: text, noRetry: !retryable, delay: waitMs});
  }
}

/* library 与 hist_* 同理：同源下可能残留脏值。条目里混进 null 时 x.scene 会抛
   TypeError，而 showLib 是由内联 onclick 调用的，抛出去就是未捕获异常、列表渲染
   不出来。saveLib / showLib / delLib 共用同一套归一，索引才对得上。 */
function loadLib(){
  const lib = store.get("library", []);
  return Array.isArray(lib) ? lib.filter(x=>x && typeof x==="object") : [];
}
/* 首页的「最近存入」：学习库里最新的一条。saveLib 用 unshift，所以 [0] 就是最新——
   和 showLib 的"从头部取"是同一个约定，两处必须一致，不然首页显示的和列表第一条对不上。
   空库时不藏整块，而是换成一句"怎么存"的说明：它恒占 .scene-list 的第四行，
   藏掉会让三张卡自己涨高。顺带也把"存哪儿去了"在首页就回答掉。
   每次回首页都要重算（goHome），不能在启动时算一次——用户存完东西回来就变了。 */
function renderRecent(){
  const el = $("recentCard"); if(!el) return;
  const tag = $("recentTag"), txt = $("recentTxt");
  const last = loadLib()[0];
  if(!last){
    if(tag){ tag.className = "tag"; tag.textContent = "学习库"; }
    /* 这句只在 375 宽下有 234px 可放：实测原文案「…在对话里点「存入学习库」」宽 258px，
       会被省略号切成「…在对话里点「存入学…」」——正好断在词中间，交付截图上一眼就看见。
       改短到 219px 后完整显示。按钮的完整名字是「存入学习库」，这里写「存入」是因为
       这一行本身就叫「学习库」，指代不会混。 */
    if(txt) txt.textContent = "还没有存过内容 · 在对话里点「存入」";
    return;
  }
  const k = SCENE_BY_NAME[last.scene];
  if(tag){ tag.className = "tag" + (k ? " k-" + k : ""); tag.textContent = last.scene || "学习库"; }
  // 摘要是单行省略的一行字，不排 markdown，所以记号要在这里逐行剥掉。
  // 不能只在整串开头剥一次：回答里第二个小标题的 ### 在中间，实测就漏在摘要里
  // （同理还有分段的 - 和分隔线 ---）。剥完按 " · " 接起来，读得出是几条要点。
  if(txt) txt.textContent = String(last.content == null ? "" : last.content)
    .split(/\n+/)
    .map(function(s){
      return s
        .replace(/^\s*(?:#{1,6}|-{2,}|\*{2,}|[-*•+]|\d+[.、)]|[①-⑳])\s*/, "")  // 行首记号 / 分隔线
        .replace(/\*\*/g, "")                                                   // 行内加粗
        .replace(/\s+/g, " ")                                                   // 行内空白压平
        .trim();
    })
    .filter(function(s){ return s; })            // 空行（含被剥空的分隔线）丢掉
    .join(" · ")
    .slice(0, 160);
}
function saveLib(btn){
  const msgEl = btn.closest(".msg");
  const content = (msgEl && msgEl._text ? msgEl._text : "").trim();
  if(!content){ toast("这条内容无法保存"); return; }
  const lib = loadLib();
  lib.unshift({scene:(curScene && SCENES[curScene] ? SCENES[curScene].name : ""), content: content, time: new Date().toLocaleString("zh-CN")});
  while(lib.length > LIB_MAX) lib.pop();
  if(!store.set("library", lib)){ toast("本机存储空间不足，保存失败"); return; }
  btn.textContent = "✓ 已保存"; btn.style.pointerEvents = "none"; toast("已存入我的 AI 学习库");
}
function showLib(){
  show("screen-lib");
  // 只渲染 LIB_MAX 条以内、且排在最前的那批：最新的在最前，saveLib 从尾部丢，
  // 所以要截头部而不是尾部。截头部才能让 delLib(i) 的索引与 loadLib() 对齐
  // ——索引一旦错位就会删错条。读取侧的渲染上限也必须与写入侧同源，否则
  // localStorage 里残留的超长数组会在一次 innerHTML 里拼出上万个节点。
  const lib = loadLib().slice(0, LIB_MAX);
  const cnt = $("libCount"); if(cnt) cnt.textContent = lib.length ? (lib.length + " 条") : "";
  // 标签按场景上色（认不出名字就退回默认蓝）。条目正文同样走 mdLite——
  // 学习库存的就是 AI 回答原文，在列表里和在对话里是同一份东西，不该只有一处排版。
  $("libList").innerHTML = lib.length ? lib.map(function(x,i){
    const k = SCENE_BY_NAME[x.scene];
    return `<div class="lib-item"><button class="del" onclick="delLib(${i})">×</button>`
      + `<span class="tag${k ? " k-" + k : ""}">${esc(x.scene)}</span>`
      + mdLite(x.content) + `<time>${esc(x.time)}</time></div>`;
  }).join("")
    : `<div class="empty">📭<br/>学习库还是空的<br/>在对话中把 AI 生成的计划、任务清单保存到这里</div>`;
}
function delLib(i){
  const lib = loadLib();                 // 必须与 showLib 用同一套归一，否则索引错位删错条
  if(!(i >= 0 && i < lib.length)) return;
  // 删除不可撤销，而 ✕ 就贴在条目正文的右上角——误触一次就永久少一条记录。
  // clearChat（1315 行）早就是"先 confirm 再动手"，这里一直漏着；本轮又把 ✕ 的
  // 命中区从 28×28 补到了 44×44，误触面只会更大，这道闸不能没有。
  // 带上内容开头，用户才知道自己删的是哪一条。
  const raw = typeof lib[i].content === "string" ? lib[i].content : "";
  const head = raw.replace(/\s+/g, " ").trim().slice(0, 20);
  if(!window.confirm("删除这条学习库记录？\n\n" + head + (head.length >= 20 ? "…" : "") + "\n\n删除后无法恢复。")) return;
  lib.splice(i,1);
  // 写失败就不要再 showLib()：它会从 localStorage 读回**没删掉**的那条，条目
  // 原样留在列表里、还一声不吭，用户会以为按钮坏了而反复点。
  if(!store.set("library", lib)){ toast("本机存储异常，删除失败"); return; }
  showLib();
}

/* ---------- 语音输入（浏览器 Web Speech，不支持时优雅降级为文字） ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recOn=false;
if(SR){
  rec=new SR(); rec.lang="zh-CN"; rec.interimResults=false;
  rec.onresult=e=>{
    const t = (e.results[0] && e.results[0][0] ? e.results[0][0].transcript : "") || "";
    const inp = $("chatInput");
    inp.value = inp.value ? (inp.value + " " + t) : t;   // 追加，不覆盖已经手打的内容
  };
  rec.onend=()=>{ recOn=false; $("micBtn").classList.remove("rec"); };
  // 按 e.error 区分原因：一律说「没有听到声音」会让授权被拒的用户徒劳重试
  rec.onerror=e=>{
    recOn=false; $("micBtn").classList.remove("rec");
    const code = (e && e.error) || "";
    toast(
      (code==="not-allowed" || code==="service-not-allowed") ? "麦克风权限被拒绝，请在浏览器设置里允许后重试" :
      (code==="audio-capture") ? "没有检测到麦克风" :
      (code==="network")       ? "语音识别服务连不上，请检查网络" :
      (code==="no-speech")     ? "没有听到声音，请再试一次" :
                                 "语音输入失败，请改用文字输入");
  };
}
function toggleVoice(){
  if(!SR){ toast("当前浏览器不支持网页语音，请用文字输入，或使用讯飞语音SDK版本"); return; }
  if(!recOn){
    try{ rec.start(); }catch(e){ toast("语音输入启动失败，请稍后重试"); return; }
    recOn=true; $("micBtn").classList.add("rec"); toast("正在聆听…");
  }else{
    try{ rec.stop(); }catch(e){}
    recOn=false; $("micBtn").classList.remove("rec");
  }
}

/* ---------- 启动：首页卡片 / NFC 与二维码可带 ?s= 场景参数直达 ---------- */
/* 卡片是 div + role="button" + tabindex="0"（不是真 <button>）：换成真按钮要连
   带重写 .scene-card 的一整套样式，而按钮的默认 text-align/font/color 都会变，
   视觉要重渲、四张交付截图（08–11）也得重拍。这里用 ARIA 的等价做法，零样式改动。
   代价是**键盘行为要自己补**——原生按钮的 Enter/Space 不会白来。 */
function activateCard(el){
  if(el.dataset.scene) openChat(el.dataset.scene);
  else if(el.id === "recentCard") showLib();
}
document.getElementById("sceneList").addEventListener("click",e=>{
  const card=e.target.closest(".scene-card"); if(card) openChat(card.dataset.scene);
});
document.getElementById("sceneList").addEventListener("keydown",e=>{
  if(e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
  const el = e.target.closest('[role="button"]'); if(!el) return;
  e.preventDefault();     // Space 默认会滚动页面，必须挡掉
  activateCard(el);
});
// 「最近存入」在 sceneList 之外，单独补一份（它只有 onclick，键盘够不着）
const _recent = document.getElementById("recentCard");
if(_recent) _recent.addEventListener("keydown", function(e){
  if(e.key !== "Enter" && e.key !== " " && e.key !== "Spacebar") return;
  e.preventDefault(); showLib();
});
// 回车发送。中文输入法在候选词上按回车是「上屏」，此时 keydown 的 key 也常常是 'Enter'，
// 不判断 isComposing 就会把还没上屏的半句话当成问题发出去。
document.getElementById("chatInput").addEventListener("keydown",e=>{
  if(e.key !== "Enter") return;
  if(e.isComposing || e.keyCode === 229) return;
  e.preventDefault(); send();
});
// 浏览器返回/前进：按历史项恢复界面，而不是直接退出页面。
// 以前这里无条件 show("screen-home")：后退回首页后再按「前进」，浏览器把地址
// 恢复成 ?s=plan 而界面仍停在首页，地址栏和界面对不上。
window.addEventListener("popstate",function(e){
  goingHome = false;          // 返回已经落地，解锁 goHome 的连按保护
  const st = e && e.state;
  if(st && st.chat && Object.prototype.hasOwnProperty.call(SCENES, st.chat)) openChat(st.chat, true);
  /* 回首页这条路也必须重算「最近存入」那一行。原来这里是裸的 show("screen-home")，
     于是 renderRecent 只在 goHome()（顶栏那枚 ‹）和启动时被调到，而**系统返回键、
     微信内置浏览器的返回箭头走的正是这里**——用户刚在对话里点了「存入学习库」，
     用返回键退回来，看到的还是存入之前的内容；本机第一次保存的话，那一行甚至
     还停在"还没有存过内容 · 在对话里点「存入」"，而学习库列表里已经有那一条了。
     同一份数据在两处显示，就得在两处都刷新。 */
  else { show("screen-home"); renderRecent(); }
});
(function init(){
  try{
    setMode(CONFIG.apiProxy ? "unknown" : "noconfig");
    /* 把初始的 aria-hidden 补齐：HTML 里只有首页带 .active（L783 `class="screen active"`），
       不先跑一次 show() 的话，对话页与学习库在无障碍树里是「可见」的（它们只是 opacity:0）。
       这里写死 "screen-home" 而不是去查 .screen.active：初值就是标记里那一个，
       查一遍只是把同一个事实再推导一次，还得依赖 querySelector 在所有环境下都在。 */
    show("screen-home");
    renderRecent();          // 首页的「最近存入」在启动时也要算一次（goHome 只管"回到首页"那条路径）
    const s = new URLSearchParams(location.search).get(CONFIG.sceneParam);
    if(Object.prototype.hasOwnProperty.call(SCENES, s)){
      // 先把当前条目标记为首页垫在下面，返回键才有的可回
      try{ history.replaceState({home:true}, "", location.pathname); }catch(e){}
      openChat(s);
    }
  }catch(e){
    // 初始化出错时不要白屏：留在首页并给出可读提示
    show("screen-home");
    toast("页面初始化出现问题，已回到首页");
    if(window.console) console.error("init failed:", e);
  }
})();
</script>
</body>
</html>
