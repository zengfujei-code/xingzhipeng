<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>星智碰 · AI 学习搭档</title>
<style>
  :root{
    --blue:#00B0F0; --deep:#003A8C; --ink:#12244B; --sub:#5B6B8C;
    --bg:#F2F8FF; --card:#FFFFFF; --line:#E2EEFB; --ok:#18C19B;
    --radius:16px; --shadow:0 8px 24px rgba(0,90,180,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(180deg,#E8F5FF 0%,#F2F8FF 38%,#F2F8FF 100%);
    color:var(--ink);overflow:hidden;
  }
  #app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .25s ease}
  .screen.active{opacity:1;pointer-events:auto;position:relative;flex:1;min-height:0}

  /* ---------- 首页 ---------- */
  .home-head{padding:calc(env(safe-area-inset-top) + 22px) 22px 10px;text-align:center}
  .brand{display:flex;align-items:center;justify-content:center;gap:10px}
  .logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--deep));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px;box-shadow:var(--shadow)}
  .brand-title{font-size:21px;letter-spacing:.5px;white-space:nowrap;text-align:center;margin:10px 0 0}
  @media (min-width:420px){ .brand-title{font-size:23px;letter-spacing:1px} }
  .slogan{margin-top:8px;color:var(--sub);font-size:13px;letter-spacing:2px}
  .nfc-hint{margin:14px auto 4px;width:88%;border:1px dashed #9BD4F7;background:#fff;border-radius:var(--radius);
    padding:12px 14px;display:flex;align-items:center;gap:12px}
  .nfc-ripple{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#fff 30%,#BFE9FF 32%,#BFE9FF 100%);
    position:relative;flex:none;display:flex;align-items:center;justify-content:center;font-size:20px}
  .nfc-ripple::before,.nfc-ripple::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--blue);animation:ripple 1.8s infinite}
  .nfc-ripple::after{animation-delay:.9s}
  @keyframes ripple{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.5);opacity:0}}
  .nfc-hint b{font-size:14px}.nfc-hint span{display:block;font-size:12px;color:var(--sub);margin-top:2px}
  .scene-list{padding:14px 18px 6px;display:flex;flex-direction:column;gap:12px;overflow-y:auto;flex:1;min-height:0}
  .scene-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;align-items:center;gap:14px;
    border:1px solid var(--line);cursor:pointer;transition:transform .12s}
  .scene-card:active{transform:scale(.98)}
  .scene-ico{width:48px;height:48px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff}
  .s1 .scene-ico{background:linear-gradient(135deg,#36CFFB,#0078D4)}
  .s2 .scene-ico{background:linear-gradient(135deg,#5AD8A6,#0E9F6E)}
  .s3 .scene-ico{background:linear-gradient(135deg,#FFB454,#F97316)}
  .scene-card h2{font-size:16px}.scene-card p{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
  .scene-card .go{margin-left:auto;color:#9DB4D6;font-size:20px}
  .home-foot{padding:8px 18px calc(env(safe-area-inset-bottom) + 14px);text-align:center;color:#9DB4D6;font-size:11px;line-height:1.7}
  /* 连接状态徽章：只反映「有没有真的连上 AI」，本页面不存在演示/离线兜底内容 */
  .status-badge{display:inline-block;background:#FFF4E0;color:#C77A1A;border-radius:999px;padding:2px 10px;font-size:11px;margin-bottom:6px}
  .status-badge.ok{background:#E7F8F2;color:#0E9F6E}
  .status-badge.err{background:#FDECEC;color:#C0392B}

  /* ---------- 对话页 ---------- */
  .chat-head{background:#fff;border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;display:flex;align-items:center;gap:10px}
  .back{width:34px;height:34px;border-radius:50%;border:none;background:#EEF6FF;font-size:18px;color:var(--deep);cursor:pointer;flex:none}
  .chat-head h2{font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-head .lib-btn{border:1px solid var(--line);background:#fff;border-radius:999px;font-size:11px;color:var(--deep);padding:5px 10px;cursor:pointer;flex:none;white-space:nowrap}
  .chat-head .mini{width:34px;height:34px;border-radius:50%;border:none;background:#EEF6FF;font-size:15px;color:var(--deep);cursor:pointer;flex:none}
  .msg-wrap{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .msg.ai{background:#fff;border:1px solid var(--line);border-top-left-radius:4px;box-shadow:0 2px 8px rgba(0,90,180,.05);align-self:flex-start}
  .msg.me{background:linear-gradient(135deg,var(--blue),#1888d8);color:#fff;border-top-right-radius:4px;align-self:flex-end}
  .msg .save-btn{display:inline-block;margin-top:8px;font-size:12px;color:var(--deep);background:#EAF5FF;border:1px solid #BFE0FB;border-radius:999px;padding:3px 12px;cursor:pointer}
  /* 系统提示条：用于「服务返回了错误」这类不是模型回答的内容，样式刻意区别于对话气泡 */
  .msg.sys{align-self:center;max-width:92%;background:#FFF7E6;border:1px solid #FBE2B0;color:#8A5A00;
    font-size:12.5px;line-height:1.6;text-align:center;border-radius:10px}
  /* 连接失败提示条里的「重试」按钮 */
  .msg .retry-btn{display:inline-block;margin-top:8px;font-size:12px;color:#8A5A00;background:#FFF0CC;
    border:1px solid #F0CE85;border-radius:999px;padding:3px 14px;cursor:pointer}
  .typing{display:inline-flex;gap:4px;align-items:center}.typing i{width:6px;height:6px;border-radius:50%;background:#9DB4D6;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  .quick{padding:0 14px 8px;display:flex;gap:8px;overflow-x:auto;white-space:nowrap}
  .quick span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--deep);cursor:pointer;flex:none}
  .input-bar{background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);display:flex;gap:8px;align-items:center}
  .input-bar input{flex:1;border:none;background:#F0F6FE;border-radius:999px;padding:11px 16px;font-size:14px;outline:none}
  .mic,.send{border:none;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
  .mic{background:#EEF6FF;color:var(--deep)}.send{background:linear-gradient(135deg,var(--blue),var(--deep));color:#fff}
  .mic.rec{background:#FFE9E9;color:#E5484D;animation:pulse 1s infinite}
  .mic:disabled,.send:disabled{opacity:.45;cursor:not-allowed;animation:none}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(229,72,77,.15)}}

  /* ---------- 学习库 ---------- */
  .lib-list{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
  .lib-item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.6;position:relative}
  .lib-item .tag{display:inline-block;font-size:11px;color:var(--deep);background:#EAF5FF;border-radius:6px;padding:1px 8px;margin-bottom:6px}
  .lib-item time{display:block;color:#A7B6CE;font-size:11px;margin-top:6px}
  .lib-item .del{position:absolute;top:10px;right:12px;border:none;background:none;color:#C2CDDF;font-size:16px;cursor:pointer}
  .empty{text-align:center;color:#9DB4D6;font-size:13px;margin-top:80px;line-height:2}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(18,36,75,.92);color:#fff;font-size:13px;
    padding:9px 18px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:99;max-width:80%}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <section class="screen active" id="screen-home">
    <div class="home-head">
      <div class="logo" style="margin:0 auto">星</div>
      <h1 class="brand-title">星智碰 · AI 学习搭档</h1>
      <div class="slogan">触碰唤醒星火　阅览 AI 智慧</div>
    </div>
    <div class="nfc-hint">
      <div class="nfc-ripple">📡</div>
      <div><b>碰一碰鼠标垫右上角</b><span>免安装直达，或扫描垫面二维码进入</span></div>
    </div>
    <div class="scene-list" id="sceneList">
      <div class="scene-card s1" data-scene="plan">
        <div class="scene-ico">📅</div>
        <div><h2>学习计划</h2><p>说出专业与目标，生成一周学习计划与每日任务</p></div>
        <div class="go">›</div>
      </div>
      <div class="scene-card s2" data-scene="homework">
        <div class="scene-ico">✅</div>
        <div><h2>作业管家</h2><p>口述作业要求，AI 拆解任务、排优先级与提醒</p></div>
        <div class="go">›</div>
      </div>
      <div class="scene-card s3" data-scene="ask">
        <div class="scene-ico">💬</div>
        <div><h2>随问随答</h2><p>知识点讲解、中英互译，语音提问张口就答</p></div>
        <div class="go">›</div>
      </div>
    </div>
    <div class="home-foot">
      <span class="status-badge" id="modeBadge">尚未对话 · 首次提问时连接讯飞星火</span><br/>
      广州应用科技学院 · 科大讯飞AI产业学院　X+AI 文创共创计划
    </div>
  </section>

  <!-- 对话页 -->
  <section class="screen" id="screen-chat">
    <div class="chat-head">
      <button class="back" onclick="goHome()" aria-label="返回首页">‹</button>
      <h2 id="chatTitle">AI 学习搭档</h2>
      <button class="mini" onclick="clearChat()" aria-label="清空本场景对话" title="清空本场景对话">🧹</button>
      <button class="lib-btn" onclick="showLib()">我的学习库</button>
    </div>
    <div class="msg-wrap" id="msgWrap"></div>
    <div class="quick" id="quickBar"></div>
    <div class="input-bar">
      <button class="mic" id="micBtn" onclick="toggleVoice()">🎤</button>
      <input id="chatInput" placeholder="说一句或输入你的需求…" />
      <button class="send" id="sendBtn" onclick="send()">➤</button>
    </div>
  </section>

  <!-- 学习库 -->
  <section class="screen" id="screen-lib">
    <div class="chat-head">
      <button class="back" onclick="goHome()" aria-label="返回首页">‹</button>
      <h2>我的 AI 学习库</h2>
      <button class="lib-btn" onclick="showLib()">刷新</button>
    </div>
    <div class="lib-list" id="libList"></div>
  </section>

</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
 * 星智碰 H5 —— 配置区
 * 网页本体放在静态托管（GitHub/Gitee Pages）里浏览器才能正常显示；
 * 星火智能体由云函数代理，这里填云函数地址即可。API Key/Secret 只
 * 存在云函数后台，绝不写进本文件。
 * ============================================================ */
const CONFIG = {
  apiProxy: "https://1491306416-dv2u0ynvjn.ap-guangzhou.tencentscf.com/api/chat",  // 星火助手 API 后端代理（云函数）
  sceneParam: "s",       // NFC 标签可写入 https://域名/?s=plan 直达场景
  timeoutMs: 70000       // 前端等待上限：必须大于云函数内部超时（50 秒），否则会先于后端放弃
};

/* hint 是**页面写的开场提示**，不是模型说的话——所以它显示成系统提示条，绝不进 AI 气泡。
   用第三人称「AI 会…」而不是「我帮你…」：用第一人称会让人以为这是模型的开场白。 */
const SCENES = {
  plan:     {name:"学习计划", hint:"可以这样开始：告诉我你的专业、本周课程目标或备考科目，AI 会帮你排一周计划。",
             quick:["我是人工智能专业，本周想学好Python循环","期末高数还有两周，帮我安排复习","每天晚上7到10点可自习，做英语四级计划"]},
  homework: {name:"作业管家", hint:"把作业要求念给我听（科目、内容、截止时间），AI 会帮你拆成任务清单并排优先级。",
             quick:["高数习题册第3章12道题，周五交","英语作文一篇200词，下周三前","数据结构实验报告，周日晚上截止"]},
  ask:      {name:"随问随答", hint:"随时提问知识点，或说一句中文/英文，AI 会帮你讲解和翻译。",
             quick:["用通俗的话讲一下什么是递归","把“人工智能正在改变学习方式”翻译成英文","解释NFC为什么碰一下就能打开网页"]}
};

/* ---------- 学术诚信前端拦截（这是一道「减速带」，不是硬约束） ----------
   这段是纯前端正则，只检查当前这一条消息，**确定可以被绕过**：
   分成两条发（第二条没有动词）、在关键词中间插入零宽字符、换一个同义词，
   都能通过。它也会误拦「帮我写个总结」这类正常的学习请求。
   真正起作用的是云端那份系统提示词的自觉约束，服务端并没有第二道闸。
   所以：对外说明时不要把它讲成可靠的完整防护。 */
function guard(text){
  const t = text.replace(/\s+/g,'');
  const verb = /(帮我写|替我写|给我写|帮我做|帮我弄|帮我整|写一篇|写个|写一份|写段|生成一篇|生成一份|生成个|凑字数|凑一篇|直接给我|给我一份|来一篇|来份|帮我搞定|帮我完成)/;
  const essay = /(论文|报告|总结|心得|读后感|观后感|演讲稿|发言稿|主持稿|新闻稿|实践报告|实验报告|策划案|策划书|申请书|检讨书|思想汇报|入党申请|征文|作文|体会|感悟|汇报材料)/;
  const homework = /(帮我写作业|帮我写代码|帮我做题|帮我写程序|给我答案|把.*答案.*给我|代写)/;
  if((verb.test(t) && essay.test(t)) || homework.test(t)){
    return "成篇代写我不能做，但能帮你把这件事真正做好。我可以给你：\n① 一份提纲或框架；\n② 三到四个可展开的角度或要点；\n③ 相关的检索关键词。\n\n你想先从哪一部分开始？";
  }
  return null;
}

/* ---------- 状态与存储 ---------- */
let curScene = null;
let sending = false;   // 「当前场景」有没有在途请求：按钮禁用与回车拦截都看它
let viewGen = 0;       // openChat 每重建一次视图就 +1，用来识别「回复到达时视图已被换过」
const $ = id => document.getElementById(id);
// 一个场景保留、重放、上送的轮数上限。三处必须是同一个数：写进存储的（pushHist）、
// 重进场景时显示的（openChat）、发给模型的（requestReply 的 history）——只要有一处
// 更大，就会出现「界面说聊过、模型没看到」。
const HIST_MAX = 12;
// 学习库保留与渲染的条数上限。saveLib 从尾部丢、showLib 取头部渲染，两处同源。
const LIB_MAX = 200;
const store = {
  get(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v===null?d:v; }catch(e){ return d; } },
  // set 返回是否成功：写满配额 / 隐私模式下 setItem 会抛异常，调用方需要知道
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }
};
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1800); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function sceneName(s){ return (SCENES[s] && SCENES[s].name) ? SCENES[s].name : "该场景"; }

/* hist_* 只应该存 {q,a} 数组，但同源下可能残留旧版本或手工写过的脏值。
   以前这里直接 store.get(...).slice(-12)，脏值会让 .slice 抛 TypeError——而它
   正好落在「取回答」的 try 里，会被 catch 当成网络异常，报成一句永远不会自愈的
   「请检查网络」。这里和 pushHist / showLib 一样先归一。 */
function loadHist(scene){
  const h = store.get("hist_"+scene, []);
  return Array.isArray(h) ? h.filter(t=>t && typeof t==="object") : [];
}

function show(id){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active")); $(id).classList.add("active"); }
function goHome(){ show("screen-home"); if(history.state && history.state.chat){ try{ history.back(); }catch(e){} } }

/* 首页徽章只反映「有没有真的连上 AI」：只有真收到模型回答才显示「已接入」。
   本页面不产生任何本地回答，所以没有「演示模式」这种状态。

   busy / denied 用于「服务是通的，只是这次请求没成」：429 限流、400 参数错误都
   说明网络没问题，写成「未连接到 AI 服务 · 请检查网络」会把用户引去排查一个
   根本不存在的网络故障。徽章是本页唯一的连接状态指示，误报等于给出错误结论。 */
function setMode(state){
  const b=$("modeBadge"); if(!b) return;
  if(state==="online"){ b.textContent="已接入讯飞星火智能体"; b.className="status-badge ok"; }
  else if(state==="busy"){ b.textContent="AI 服务繁忙 · 请稍后再试"; b.className="status-badge err"; }
  else if(state==="empty"){ b.textContent="AI 未返回内容 · 请重试"; b.className="status-badge err"; }
  else if(state==="denied"){ b.textContent="请求未被受理 · 请看下方提示"; b.className="status-badge err"; }
  else if(state==="offline"){ b.textContent="未连接到 AI 服务 · 请检查网络"; b.className="status-badge err"; }
  else if(state==="noconfig"){ b.textContent="未配置 AI 服务地址"; b.className="status-badge err"; }
  else { b.textContent="尚未对话 · 首次提问时连接讯飞星火"; b.className="status-badge"; }
}
/* 在途请求按场景记账。以前是一个全局 sending 布尔：在 A 提问后切到 B，B 的按钮
   会被锁到 A 的请求结束（最长 70 秒），而 A 那一轮的结果注定被丢弃——这段等待
   没有任何收益，用户只看到一个没有理由的禁用按钮。 */
/* 把「这次请求为什么没成」映射成徽章状态。徽章是本页唯一的连接状态指示，
   不能一律报成「未连接到 AI 服务 · 请检查网络」——429 限流、400 参数错误都
   说明网络是好的，那样写会把用户引去排查一个不存在的网络故障。 */
function modeForStatus(status, ok){
  if(ok) return "empty";                              // 200 却没内容：服务通了，这次没答出东西
  if(status === 429 || status === 503) return "busy"; // 服务通了但忙
  if(status >= 500) return "offline";                 // 5xx：服务端故障，按连不上处理
  return "denied";                                    // 400/403/405：请求本身没被受理
}
const pending = new Map();
function syncSending(){
  sending = pending.has(curScene);      // 只反映「当前场景」有没有在途请求
  const b=$("sendBtn"), m=$("micBtn");
  if(b) b.disabled = sending;
  if(m) m.disabled = sending;
  return sending;
}

function openChat(scene, noPush){
  // 用 hasOwnProperty 判断：SCENES 是普通对象，SCENES["constructor"] 之类会是真值
  if(!Object.prototype.hasOwnProperty.call(SCENES, scene)) return goHome();
  curScene = scene;
  viewGen++;                                  // 本次重建的代号（见 requestReply 末尾）
  const sc = SCENES[scene];
  $("chatTitle").textContent = "AI 学习搭档 · " + sc.name;
  $("msgWrap").innerHTML = "";
  $("quickBar").innerHTML = "";
  // 用 createElement 而不是拼内联 onclick 字符串：以后文案里出现引号也不会把页面拼坏
  sc.quick.forEach(function(q){
    const s = document.createElement("span");
    s.textContent = q;
    s.onclick = function(){ quickAsk(q); };
    $("quickBar").appendChild(s);
  });
  // 开场提示走提示条，不走 AI 气泡：模型这一轮根本没说话，用气泡就是在伪造它说过
  addNotice(sc.hint);
  // 只重放与上送同一段（最近 HIST_MAX 轮）：屏幕上的上下文必须和模型看到的一致，
  // 否则用户以为「我们聊过」而模型根本没看到。顺带挡住 localStorage 里残留的超长
  // 历史（本页自己不会产生）——那会在一次同步循环里建出上万个节点、手机直接卡住。
  const hist = loadHist(scene).slice(-HIST_MAX);
  if(hist.length){
    // 重进场景时把历史重放出来：模型一直「记得」这些轮，界面不能装作没聊过
    hist.forEach(function(t){
      if(t.q) addMsg("me", t.q);
      if(t.a) addMsg("ai", t.a, {savable:true});
    });
  }
  show("screen-chat");
  syncSending();   // 在途的是别的场景就不该锁住这里
  if(!noPush){ try{ history.pushState({chat:scene}, "", "?"+CONFIG.sceneParam+"="+encodeURIComponent(scene)); }catch(e){} }
}
function clearChat(){
  if(!curScene) return;
  // 在途请求必须先等完。清空会重建视图（viewGen++），而迟到的回答是**无条件**写回
  // 历史并整体重放的：用户看到的是「清空 → 内容自己回来了」，toast 还说着「已清空」。
  // 与其让一次迟到的回调把清空推翻，不如明确让用户等一下。
  if(pending.has(curScene)){ toast("本条还在等回复，回答到达后再清空"); return; }
  if(!window.confirm("清空本场景的对话记录？清空后无法恢复。")) return;
  // 写失败就不要往下走：openChat 会从 localStorage 读回**没被清掉**的历史，屏幕上
  // 内容原样回来、toast 却说「已清空」——那是谎报。
  if(!store.set("hist_"+curScene, [])){ toast("本机存储异常，未能清空对话记录"); return; }
  openChat(curScene, true);
  toast("已清空本场景对话");
}
function quickAsk(q){ $("chatInput").value=q; send(); }

function addMsg(role, text, opts){
  opts = opts || {};
  const wrap = $("msgWrap");
  const div = document.createElement("div");
  div.className = "msg " + role;
  // 原文挂在元素属性上：存学习库时直接取，不再靠 childNodes[0] 这种 DOM 结构假设
  div._text = String(text==null?"":text);
  let html = opts.raw ? div._text : esc(div._text);
  if(opts.savable) html += '<br/><span class="save-btn" onclick="saveLib(this)">⭐ 存入学习库</span>';
  div.innerHTML = html;
  wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
  return div;
}
function addTyping(){ return addMsg("ai", '<span class="typing"><i></i><i></i><i></i></span>', {raw:true}); }
// 系统提示条：与对话气泡区分开，不进历史、不给「存入学习库」。
// 连不上时带上「重试」按钮——重试走的是同一条取回答的路径，不会重复插入用户气泡。
function addNotice(text, retry){
  const wrap = $("msgWrap");
  const div = document.createElement("div");
  div.className = "msg sys";
  // 用 textContent：服务端文案里就算带尖括号，也不会被当成 HTML 解析
  div.textContent = String(text==null?"":text);
  if(retry){
    const btn = document.createElement("span");
    btn.className = "retry-btn";
    btn.textContent = "重试";
    btn.onclick = function(){
      if(pending.has(retry.scene)) return;                       // 该场景已有在途请求
      btn.remove();                                              // 防止连点留下多个按钮
      if(retry.scene !== curScene) openChat(retry.scene, true);   // 用户已经切走，先切回去
      requestReply(retry.scene, retry.text);
    };
    div.appendChild(btn);
  }
  wrap.appendChild(div); wrap.scrollTop = wrap.scrollHeight;
  return div;
}

// fetch 本身没有超时：手机切网、隧道里连接被吞时，可能长时间既不成功也不失败，
// 打字动画就会一直转、用户以为「AI 不理我」，所以自己加一道兜底。
function fetchWithTimeout(url, opts, ms){
  const limit = ms || CONFIG.timeoutMs;
  if(typeof AbortController === "undefined"){
    // 老浏览器没有 AbortController。以前这里直接返回裸 fetch，等于把超时兜底整条
    // 去掉：连接被中间设备吞掉（既不 resolve 也不 reject）时 await 永不返回，
    // 发送键会被永久禁用，用户只能刷新页面。用 Promise.race 至少保证会退出。
    let tid;
    const guard = new Promise(function(_, reject){
      tid = setTimeout(function(){
        const e = new Error("timeout"); e.name = "TimeoutError"; reject(e);
      }, limit);
    });
    return Promise.race([fetch(url, opts), guard]).finally(function(){ clearTimeout(tid); });
  }
  const ctl = new AbortController();
  const tid = setTimeout(function(){ ctl.abort(); }, limit);
  return fetch(url, Object.assign({}, opts, {signal: ctl.signal}))
    .finally(function(){ clearTimeout(tid); });
}

// 请求体转纯 ASCII：中文一律用 \uXXXX 转义。
// 云函数在部分触发器下会把请求体按 Latin-1 解码，直接发中文会变成乱码；
// 转义后请求体不含任何非 ASCII 字节，任何解码方式都不会破坏内容。
function asciiJSON(o){
  return JSON.stringify(o).replace(/[\u007f-\uffff]/g,
    c=>"\\u"+c.charCodeAt(0).toString(16).padStart(4,"0"));
}

// 返回是否真的写进了本机存储。调用方必须据此决定怎么跟用户说话：写失败时
// 「切回去就能看到」是句假话——那一轮只在内存里，切回去重放的是存储里的旧内容。
function pushHist(scene, q, a){
  const k = "hist_"+scene;
  let h = store.get(k, []); if(!Array.isArray(h)) h = [];
  // 单条上限与云函数的 HISTORY_Q_MAX / HISTORY_A_MAX（2000 / 4000）必须一致。
  // 两边一旦不一致，超长的那一轮会被云端整条丢弃——界面重放得到、模型看不到。
  h.push({q: String(q).slice(0,2000), a: String(a).slice(0,4000)});
  while(h.length > HIST_MAX) h.shift();    // 只留最近 HIST_MAX 轮，不让 localStorage 无限膨胀
  return store.set(k, h);
}

async function send(){
  const inp = $("chatInput"), text = inp.value.trim();
  if(!text) return;
  if(pending.has(curScene)){ toast("上一条还在等回复，请稍候"); return; }
  const blocked = guard(text);
  // 拦截文案是前端规则写的，不是模型答的——所以显示成系统提示条，
  // 不能塞进 AI 气泡里冒充满分回答（这是本页唯一的「不经过模型就出字」的地方）
  if(blocked){ inp.value=""; addMsg("me",text); addNotice("学习提醒：" + blocked); return; }
  inp.value=""; addMsg("me", text);
  await requestReply(curScene, text);
}

// 取回答：只管「发请求 + 渲染结果」，不插用户气泡——所以提示条上的「重试」可以直接复用它，
// 不会在界面上重复出现一条一模一样的提问。
// 这里没有任何本地写死的兜底回答：连不上就如实说连不上，并给一个「重试」按钮。
async function requestReply(scene, text){
  if(!CONFIG.apiProxy){
    // 地址没配是配置错误，不是「AI 回答不了」——说清楚，别拿别的东西冒充回答
    setMode("noconfig");
    addNotice("未配置 AI 服务地址，无法连接讯飞星火。请在 CONFIG.apiProxy 填入云函数地址。");
    return;
  }
  if(pending.has(scene)){ toast("上一条还在等回复，请稍候"); return; }
  pending.set(scene, text); syncSending();
  const gen = viewGen;                     // 记下发起时的视图代号
  const wait = addTyping();

  let reply = null, notice = null;
  try{
    const r = await fetchWithTimeout(CONFIG.apiProxy, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: asciiJSON({scene: scene, query: text, history: loadHist(scene).slice(-HIST_MAX)})
    }, CONFIG.timeoutMs);
    // 接口约定：响应体永远是 JSON。无论 HTTP 状态码都先尝试解析并取 reply——
    // 否则云函数为 400/429/503 写好的那些「给用户看的话」一句都到不了用户眼前。
    let data = null;
    try{ data = await r.json(); }catch(e){ data = null; }
    const msg = (data && typeof data.reply === "string") ? data.reply.trim() : "";
    if(r.ok && msg){ reply = msg; setMode("online"); }
    else {
      notice = msg || (r.ok
        // 200 却没内容：说成「服务暂时不可用（HTTP 200）」自相矛盾，也不该
        // 归到「没连上」里去——服务明明连上了，只是这次没答出东西。
        ? "服务返回异常（HTTP 200），这次没有拿到回答，请重试。"
        : "服务暂时不可用（HTTP " + r.status + "），请稍后重试。");
      setMode(modeForStatus(r.status, r.ok));
    }
  }catch(e){
    // 网络失败 / 超时 / 跨域被拦：如实告诉用户这次没连上，不编内容
    if(e && (e.name === "AbortError" || e.name === "TimeoutError"))
      notice = "等待讯飞星火回复超时（超过 " + Math.round(CONFIG.timeoutMs/1000) + " 秒），本次没有收到回答。";
    else
      notice = "没能连上 AI 服务，请检查网络后重试。";
    setMode("offline");
  }

  if(wait) wait.remove();
  pending.delete(scene); syncSending();

  // 用户已切走、或视图被「重进场景」重建过时，不能把结果直接 append 到当前 DOM：
  // 那会落到别的场景里，或出现一条「没有对应提问的回答」。但也不能一丢了之——
  // 这一轮已经花掉了星火额度，而提问气泡本来就只在内存里，丢了等于用户什么都没问过。
  // 所以：先无条件落历史，再按「视图还是不是原来那一个」决定怎么显示。
  if(reply){
    // 能走到这里就一定是模型答的：可存学习库、也写进历史。
    // 历史必须记——模型靠它保持上下文，重进场景也会重放这段对话。
    // saved=false 表示本机存储写不进去（配额满 / 存储被禁）。这一轮只在内存里，
    // 所以凡是「切回去就能看到」的说法都不成立；能显示的路径要先把回答显示出来，
    // 不让它无声消失。
    const saved = pushHist(scene, text, reply);
    if(scene === curScene && gen === viewGen){
      addMsg("ai", reply, {savable:true});
      if(!saved) toast("本机存储异常，这条回答没能保存");
      return;
    }
    // 视图换过了：按历史整体重放，保证「提问在前、回答在后」的顺序
    if(scene === curScene){
      if(saved){ openChat(scene, true); toast("回答已到达"); }
      // 存不下就别重放（重放里没有这一轮，回答会无声消失），直接补一条上去
      else { addMsg("ai", reply, {savable:true}); toast("本机存储异常，这条回答没能保存"); }
      return;
    }
    toast(saved
      ? ("「" + sceneName(scene) + "」的回答已到达，切回去就能看到")
      : ("「" + sceneName(scene) + "」的回答到了，但本机存不下，切回去看不到"));
    return;
  }
  if(notice){
    if(scene !== curScene){ toast("「" + sceneName(scene) + "」这一次没有拿到回答"); return; }
    if(gen !== viewGen) openChat(scene, true);
    addNotice(notice, {scene: scene, text: text});
  }
}

/* library 与 hist_* 同理：同源下可能残留脏值。条目里混进 null 时 x.scene 会抛
   TypeError，而 showLib 是由内联 onclick 调用的，抛出去就是未捕获异常、列表渲染
   不出来。saveLib / showLib / delLib 共用同一套归一，索引才对得上。 */
function loadLib(){
  const lib = store.get("library", []);
  return Array.isArray(lib) ? lib.filter(x=>x && typeof x==="object") : [];
}
function saveLib(btn){
  const msgEl = btn.closest(".msg");
  const content = (msgEl && msgEl._text ? msgEl._text : "").trim();
  if(!content){ toast("这条内容无法保存"); return; }
  const lib = loadLib();
  lib.unshift({scene:(curScene && SCENES[curScene] ? SCENES[curScene].name : ""), content: content, time: new Date().toLocaleString("zh-CN")});
  while(lib.length > LIB_MAX) lib.pop();
  if(!store.set("library", lib)){ toast("本机存储空间不足，保存失败"); return; }
  btn.textContent = "✓ 已保存"; btn.style.pointerEvents = "none"; toast("已存入我的 AI 学习库");
}
function showLib(){
  show("screen-lib");
  // 只渲染 LIB_MAX 条以内、且排在最前的那批：最新的在最前，saveLib 从尾部丢，
  // 所以要截头部而不是尾部。截头部才能让 delLib(i) 的索引与 loadLib() 对齐
  // ——索引一旦错位就会删错条。读取侧的渲染上限也必须与写入侧同源，否则
  // localStorage 里残留的超长数组会在一次 innerHTML 里拼出上万个节点。
  const lib = loadLib().slice(0, LIB_MAX);
  $("libList").innerHTML = lib.length ? lib.map((x,i)=>
    `<div class="lib-item"><button class="del" onclick="delLib(${i})">×</button><span class="tag">${esc(x.scene)}</span><br/>${esc(x.content)}<time>${esc(x.time)}</time></div>`).join("")
    : `<div class="empty">📭<br/>学习库还是空的<br/>在对话中把 AI 生成的计划、任务清单保存到这里</div>`;
}
function delLib(i){
  const lib = loadLib();                 // 必须与 showLib 用同一套归一，否则索引错位删错条
  if(!(i >= 0 && i < lib.length)) return;
  lib.splice(i,1);
  // 写失败就不要再 showLib()：它会从 localStorage 读回**没删掉**的那条，条目
  // 原样留在列表里、还一声不吭，用户会以为按钮坏了而反复点。
  if(!store.set("library", lib)){ toast("本机存储异常，删除失败"); return; }
  showLib();
}

/* ---------- 语音输入（浏览器 Web Speech，不支持时优雅降级为文字） ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, recOn=false;
if(SR){
  rec=new SR(); rec.lang="zh-CN"; rec.interimResults=false;
  rec.onresult=e=>{
    const t = (e.results[0] && e.results[0][0] ? e.results[0][0].transcript : "") || "";
    const inp = $("chatInput");
    inp.value = inp.value ? (inp.value + " " + t) : t;   // 追加，不覆盖已经手打的内容
  };
  rec.onend=()=>{ recOn=false; $("micBtn").classList.remove("rec"); };
  // 按 e.error 区分原因：一律说「没有听到声音」会让授权被拒的用户徒劳重试
  rec.onerror=e=>{
    recOn=false; $("micBtn").classList.remove("rec");
    const code = (e && e.error) || "";
    toast(
      (code==="not-allowed" || code==="service-not-allowed") ? "麦克风权限被拒绝，请在浏览器设置里允许后重试" :
      (code==="audio-capture") ? "没有检测到麦克风" :
      (code==="network")       ? "语音识别服务连不上，请检查网络" :
      (code==="no-speech")     ? "没有听到声音，请再试一次" :
                                 "语音输入失败，请改用文字输入");
  };
}
function toggleVoice(){
  if(!SR){ toast("当前浏览器不支持网页语音，请用文字输入，或使用讯飞语音SDK版本"); return; }
  if(!recOn){
    try{ rec.start(); }catch(e){ toast("语音输入启动失败，请稍后重试"); return; }
    recOn=true; $("micBtn").classList.add("rec"); toast("正在聆听…");
  }else{
    try{ rec.stop(); }catch(e){}
    recOn=false; $("micBtn").classList.remove("rec");
  }
}

/* ---------- 启动：首页卡片 / NFC 与二维码可带 ?s= 场景参数直达 ---------- */
document.getElementById("sceneList").addEventListener("click",e=>{
  const card=e.target.closest(".scene-card"); if(card) openChat(card.dataset.scene);
});
// 回车发送。中文输入法在候选词上按回车是「上屏」，此时 keydown 的 key 也常常是 'Enter'，
// 不判断 isComposing 就会把还没上屏的半句话当成问题发出去。
document.getElementById("chatInput").addEventListener("keydown",e=>{
  if(e.key !== "Enter") return;
  if(e.isComposing || e.keyCode === 229) return;
  e.preventDefault(); send();
});
// 浏览器返回/前进：按历史项恢复界面，而不是直接退出页面。
// 以前这里无条件 show("screen-home")：后退回首页后再按「前进」，浏览器把地址
// 恢复成 ?s=plan 而界面仍停在首页，地址栏和界面对不上。
window.addEventListener("popstate",function(e){
  const st = e && e.state;
  if(st && st.chat && Object.prototype.hasOwnProperty.call(SCENES, st.chat)) openChat(st.chat, true);
  else show("screen-home");
});
(function init(){
  try{
    setMode(CONFIG.apiProxy ? "unknown" : "noconfig");
    const s = new URLSearchParams(location.search).get(CONFIG.sceneParam);
    if(Object.prototype.hasOwnProperty.call(SCENES, s)){
      // 先把当前条目标记为首页垫在下面，返回键才有的可回
      try{ history.replaceState({home:true}, "", location.pathname); }catch(e){}
      openChat(s);
    }
  }catch(e){
    // 初始化出错时不要白屏：留在首页并给出可读提示
    show("screen-home");
    toast("页面初始化出现问题，已回到首页");
    if(window.console) console.error("init failed:", e);
  }
})();
</script>
